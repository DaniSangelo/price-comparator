services:
  lidl-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lidl-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
      MSSQL_PID: "Express"
    ports:
      - "14335:1433"
    volumes:
      - lidl_mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\" -C > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  lidl_mssql_data:
