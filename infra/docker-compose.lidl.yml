services:
  lidl-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lidl-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
      MSSQL_PID: "Express"
    ports:
      - "14335:1433"
    volumes:
      - lidl_mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\" -C > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  lidl-api:
    build:
      context: ..
      dockerfile: apps/external-apis/lidl-api/src/Lidl.Api/Dockerfile
    container_name: lidl-api  
    depends_on:
      lidl-mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Default: "Server=lidl-mssql,1433;Database=lidl;User Id=sa;Password=Password123!;TrustServerCertificate=True;"
      APP_NAME: lidl-api
    ports:
      - "3004:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  lidl_mssql_data:
