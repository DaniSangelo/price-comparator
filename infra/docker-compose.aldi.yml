services:
  aldi-api:
    build:
      context: ../apps/external-apis/aldi-api
      dockerfile: Dockerfile
    container_name: aldi-api
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://aldi:aldi@aldi-postgres:5432/aldi
      APP_NAME: aldi-api
      PORT: 3333
      NODE_ENV: production
      LOG_LEVEL: info
    depends_on:
      aldi-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  aldi-postgres:
    image: postgres:16
    container_name: aldi-postgres
    environment:
      POSTGRES_DB: aldi
      POSTGRES_USER: aldi
      POSTGRES_PASSWORD: aldi
    ports:
      - "5434:5432"
    volumes:
      - aldi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aldi -d aldi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aldi_postgres_data:
